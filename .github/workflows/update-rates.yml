name: Update rates

on:
  schedule:
    # Off-peak minutes: GitHub often skips jobs scheduled at :00 / :30.
    - cron: "7,22,37,52 * * * *"   # about every 15 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rates
        run: python .github/scripts/update_rates.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add market.json mastercard.json gold.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update USD→INR rates"
          git pull --rebase origin main
          git push
